schema_version: 2

planet:
  earth_like: true
  radius_km: 6371.0
  axial_tilt_deg: 23.44
  orbital_eccentricity: 0.0167
  solar_constant_relative: 1.0
  rotation_period_hours: 24.0
  year_days: 365.2422

map:
  topology: cylindrical
  wrap_x: true
  wrap_y: false
  projection: cylindrical_equal_area

analysis_grid:
  width: 256
  height: 128
  orientation: flat_top

resolution:
  tectonics: [1024, 512]
  climate: [1024, 512]
  terrain_target: [4096, 2048]
  # Locked by Milestone 5 benchmark (docs/validation/milestone5_benchmark.json).
  terrain_production: [4096, 2048]
  hydrology_target: [4096, 2048]

ocean:
  fraction_target: 0.71
  # CR-3: anomaly coupling + modest mix; decay in physical km (trial 800–1500).
  sst_mix: 0.28
  sst_inland_decay_km: 1200.0
  inland_decay_cells: 60.0  # legacy UI / migration only; ignored when km set
  western_boundary_width_km: 250.0
  western_warm_c: 2.2
  eastern_cool_c: 1.8

# Atlas UX — geography defaults (user-tuned Atlas 2026-08-15)
tectonics:
  num_plates: 7
  cycle_count: 3
  folding_ratio: 0.01
  sea_level: 0.65
  erosion_period: 100

terrain:
  detail_amplitude: 0.02
  land_scale_m: 9000.0
  ocean_scale_m: 10000.0
  orogeny_boost: 0.05
  activity_relief: 0.25
  boundary_relief: 0.35
  # CR-5: calibrated power_tail_v2 (body exponent from 1.2/1.5/1.8 trial band).
  hypsometry_mode: power_tail_v2
  hypsometry_anchor_quantile: 0.95
  hypsometry_anchor_elevation_m: 3000.0
  hypsometry_body_exponent: 1.5
  # hypsometry_max_elevation_m: 9000.0  # defaults to land_scale_m when omitted
  hypsometry_tail_softness: 1.0

erosion:
  # First-pass (pre-hydrology). thermal_kappa is the 1 km-cell coefficient
  # (kappa_m2 = thermal_kappa * 1000^2). fluvial_k is precip×slope on this
  # pass only — it does not control final stream-power incision.
  iterations: 5
  thermal_kappa: 20.0
  fluvial_k: 8.0
  max_step_m: 25.0
  macro_blend: 0.35
  # Final river incision (independent of fluvial_k). C3 does not retune these.
  stream_power_k: 500.0
  stream_power_iterations: 4
  stream_power_max_step_m: 30.0
  stream_power_macro_blend: 0.40
  micro_fill_max_depth_m: 25.0

climate:
  months: 12
  # Global temperature offset (°C). Tuned so tropical Holdridge belts appear.
  base_temp_c: 25.0
  # CR-2: explicit continentality length (legacy 24 cells ≈ 1876 km mid-lat Atlas).
  continentality_scale_km: 500.0
  # C3T: inland seasonal-amplitude gain. 0 = production (not a retune).
  continental_seasonality_gain: 0.0

# Holdridge PET/P scaling: precip_proxy × precip_scale_mm → mm-like annual precip
ecology:
  precip_scale_mm: 200.0

# Atlas-tuned moisture inland (2026-08-15)
moisture:
  # C4: numerical CFL cap (legacy alias advect_steps). Not physical reach.
  advect_steps: 32
  advect_max_substeps: 32
  advect_wind_scale: 0.2
  large_scale_frac: 0.15
  orographic_frac: 0.85
  convective_scale: 2.0
  ocean_evap_rate: 1.4
  lake_evap_rate: 0.75
  river_evap_rate: 0.40
  land_et_rate: 0.4
  continentality_dry: 0.4
  lee_dry: 0.12
  # CR-8: condensation brake on leeward descent (not a q mass sink).
  # PR-4 — physical diffusion + periodic climatology spin-up
  diffusion_mix_per_month: 0.08
  # CR-3/C4: production cap — early-stop field gates; audit seeds needed ~16–20.
  spinup_max_years: 48
  spinup_tolerance_relative: 0.02
  spinup_tolerance_absolute: 0.001
  # PR-7 / revised B8 — inside moisture budget (no post-hoc rain)
  plume_strength: 0.18
  # Physical soft-plume neighbour reach (CR-2); steps derived via GridMetrics.
  plume_mix_reach_km: 500.0
  land_store_capacity: 8.0
  itcz_convective_scale: 1.2
  itcz_width_deg: 8.0
  # PR-8 / CR-8 — anomaly monsoon vs own annual means; gated if sign never flips
  monsoon_strength: 0.35
  monsoon_lat_band_min_abs_deg: 5.0
  monsoon_lat_band_max_abs_deg: 32.0
  monsoon_max_anomaly_ms: 3.5
  monsoon_coast_reach_km: 800.0
  monsoon_coast_reach_cells: 10.0  # legacy; ignored when km set
  monsoon_temp_scale_c: 8.0
  monsoon_regional_mean_km: 500.0
  # CR-8: regional mean of land/SST anomalies (km). advect_steps is a CFL cap.

# Plan B7 — precip-aware river/lake visibility (DEM topology unchanged)
hydrology:
  # CR-6: top 3.5% accumulation (0.02 hid ~104k km² trunks on Atlas).
  river_acc_fraction: 0.10
  lake_min_depth_m: 2.0
  # Quantile of discharge on accumulation candidates (0.5 ≈ drop driest half of network).
  river_discharge_candidate_quantile: 0.50
  # Rain-fed lakes need local precip ≥ land p70; river-fed need river touch + not arid (p45).
  lake_precip_land_quantile: 0.70
  lake_arid_precip_land_quantile: 0.45
  # Drop ice-sheet / polar fill depressions (mean annual °C).
  lake_min_mean_temp_c: 1.0
  lake_inflow_land_quantile: 0.75
  # Channel-bed loss (C2) uses HydrologyParams.bed_loss_m3_per_km_month, not PET×cell.
  # transmission_rate is retained for config compatibility and is unused by C2 routing.
  transmission_rate: 0.45
  # CR-4: fill only numerical pits shallower than this pour depth (m).
  # Negative = legacy fill-all (no closed basins).
  fill_max_depth_m: 25.0
  # CR-5: physical river catchment floor (km²); cell count derived via GridMetrics.
  # CR-7: applied *before* river_acc_fraction display LOD.
  river_min_catchment_km2: 500.0
  # PR-6 — snow/runoff (defaults); optional river_min_effective_discharge for absolute Q floor
  # CR-7 soil bucket / Q m³/s / channel states use HydrologyParams defaults
  # (soil_capacity=1.0, soil_quickflow_frac=0.20, transmission_ref_km=50).

# CR-9 / PR-9E — landform thresholds (score retune; km scales + km² floors)
landforms:
  mountain_score_threshold: 0.60
  plateau_score_threshold: 0.40
  fine_radius_km: 60.0
  meso_radius_km: 150.0
  macro_radius_km: 300.0
  min_range_km2: 800.0
  min_plateau_km2: 2500.0

generation:
  quality: final
