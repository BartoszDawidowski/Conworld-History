[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim"
version = "0.0.0"
description = "Physical world generation worker for Conworld History"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Conworld History" }]
dependencies = [
    "numpy==2.2.6",
    "PyYAML==6.0.2",
    "pyflwdir==0.5.12",
    # Install vendored fork first: `uv pip install -e ../vendor/pyplatec`
    # (provides import name `platec` with Milestone 3 getters).
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]
packaging = [
    "pyinstaller==6.14.2",
]

[project.scripts]
worldsim = "worldsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running generation tests (e.g. full 1024×512 PyPlatec)",
]
