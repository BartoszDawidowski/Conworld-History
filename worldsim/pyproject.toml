[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim"
version = "0.0.0"
description = "Physical world generation worker for Conworld History"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Conworld History" }]
dependencies = [
    "numpy==2.2.6",
    "PyYAML==6.0.2",
    "pyflwdir==0.5.12",
    # Install vendored fork first: `uv pip install -e ../vendor/pyplatec`
    # (provides import name `platec` with Milestone 3 getters).
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]
packaging = [
    "pyinstaller==6.14.2",
]

[project.scripts]
worldsim = "worldsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running generation tests (e.g. full 1024×512 PyPlatec)",
    "realism_audit: annex physical-realism invariants (xfail until fixed)",
    "pc0: production-closure baseline regressions and frozen Atlas 183716 metrics",
    "pc1: lake-supernode condensed routing (PC1)",
    "pc3: G0 snow/soil/firn foundation (PC3)",
    "pc2: final-Q network and channel tiers (PC2)",
    "pc4: geomorphic erosion and process-specific gates (PC4)",
    "pc5: landform systems and honest acceptance (PC5)",
    "pc6: canonical products, effective config, Godot inspector (PC6)",
    "pc7: production suite, performance recovery, C10 readiness (PC7)",
]
