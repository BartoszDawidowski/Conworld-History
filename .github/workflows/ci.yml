name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: worldsim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Install platec + worldsim (Unix)
        if: runner.os != 'Windows'
        working-directory: .
        run: |
          python -m pip install -U pip
          python -m pip install -e ./vendor/pyplatec
          python -m pip install -e "./worldsim[dev]"

      - name: Install platec + worldsim (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          py -3.12 -m pip install -U pip
          py -3.12 -m pip install -e .\vendor\pyplatec
          py -3.12 -m pip install -e ".\worldsim[dev]"

      - name: Pytest
        run: python -m pytest -m "not slow" -q

  package-macos:
    name: package macOS worker
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deps + worker
        run: |
          brew install cmake || true
          python -m pip install -U pip
          python -m pip install -e ./vendor/pyplatec
          python -m venv worldsim/.venv
          worldsim/.venv/bin/pip install -U pip
          worldsim/.venv/bin/pip install -e ./vendor/pyplatec
          worldsim/.venv/bin/pip install -e "./worldsim[dev]"
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: worldsim_worker-macos
          path: packaging/dist/worldsim_worker/

  package-windows:
    name: package Windows worker
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build worker
        shell: pwsh
        run: |
          py -3.12 -m pip install -U pip
          .\packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: worldsim_worker-windows
          path: packaging/dist/worldsim_worker/
